        <text x="14" y="19" fill="#93C5FD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">PUBLIC spellF1</text>
        <text x="14" y="39" fill="#F8FAFC" font-family="Consolas, Segoe UI, monospace" font-size="18" font-weight="700">0.6625</text>

        <rect x="144" y="0" width="136" height="48" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#A50044" stroke-opacity="0.75"/>
        <text x="158" y="19" fill="#FDA4AF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">PUBLIC macroF1</text>
        <text x="158" y="39" fill="#F8FAFC" font-family="Consolas, Segoe UI, monospace" font-size="18" font-weight="700">0.9306</text>

        <rect x="292" y="0" width="164" height="48" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#0EA5E9" stroke-opacity="0.65"/>
        <text x="306" y="19" fill="#7DD3FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">CV BALL RECOVERED</text>
        <text x="306" y="39" fill="#F8FAFC" font-family="Consolas, Segoe UI, monospace" font-size="18" font-weight="700">+24,276 f</text>

        <rect x="468" y="0" width="150" height="48" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#10B981" stroke-opacity="0.65"/>
        <text x="482" y="19" fill="#6EE7B7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">GT LEAKAGE</text>
