    <!-- Subtle Vector Tactical Pitch Radar (right side background) -->
    <g stroke="#94A3B8" stroke-opacity="0.13" stroke-width="1.6" fill="none" transform="translate(650, 24)">
      <rect x="0" y="0" width="510" height="232" rx="6"/>
      <line x1="255" y1="0" x2="255" y2="232"/>
      <circle cx="255" cy="116" r="46"/>
      <circle cx="255" cy="116" r="3" fill="#94A3B8" fill-opacity="0.25"/>
      <rect x="0" y="50" width="78" height="132"/>
      <rect x="432" y="50" width="78" height="132"/>
      <rect x="0" y="82" width="28" height="68"/>
      <rect x="482" y="82" width="28" height="68"/>
      <!-- Simulated ball pass trajectory -->
      <path d="M 145 162 Q 240 88 335 122" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2.2" stroke-dasharray="6 5"/>
      <path d="M 335 122 Q 390 105 426 144" stroke="#F59E0B" stroke-opacity="0.65" stroke-width="2.4"/>
      <circle cx="145" cy="162" r="5" fill="#3B82F6" fill-opacity="0.7" stroke="none"/>
      <circle cx="215" cy="112" r="5" fill="#3B82F6" fill-opacity="0.6" stroke="none"/>
