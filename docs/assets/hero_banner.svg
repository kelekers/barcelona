    <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="17.5" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Left Content -->
    <g transform="translate(52, 48)">
      <rect x="0" y="0" width="388" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#22C55E"/>
      <text x="27" y="17.5" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.9">
