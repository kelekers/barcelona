<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Hybrid v2 + CV — More than a Hack 2027 Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#18122B"/>
    </linearGradient>
    <linearGradient id="blaugrana" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052B4"/>
      <stop offset="50%" stop-color="#A50044"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="30%" r="55%">
